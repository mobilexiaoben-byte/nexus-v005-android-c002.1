name: NEXUS V005/C002 - Canonical APK Build

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: Source ZIP to build
        required: false
        default: NEXUS_V005_C002_AUTHDIAG001_SOURCE.zip
      project_root:
        description: Android project root after extraction
        required: false
        default: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
      artifact_name:
        description: APK artifact basename without .apk
        required: false
        default: NEXUS-V005-C002-AUTHDIAG001-debug
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - '.github/actions/nexus-v005-c002-branding/**'
      - 'ci/apply-nexus-v005-c002-branding.sh'
      - 'ci/verify-nexus-v005-c002-apk.sh'
      - 'assets/nexus-icon.png'
      - 'NEXUS_V005_C002_AUTHDIAG001_SOURCE.zip'

permissions:
  contents: read

env:
  SOURCE_ZIP: ${{ inputs.source_zip || 'NEXUS_V005_C002_AUTHDIAG001_SOURCE.zip' }}
  PROJECT_ROOT: ${{ inputs.project_root || 'work/V005_ANDROID_CHROMIUM_WEBVIEW_C002' }}
  ARTIFACT_NAME: ${{ inputs.artifact_name || 'NEXUS-V005-C002-AUTHDIAG001-debug' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          rm -rf work
          mkdir -p work
          unzip -q "$SOURCE_ZIP" -d work
          test -f "$PROJECT_ROOT/settings.gradle.kts"
          echo "Source extraction: PASS ($SOURCE_ZIP)"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Verify Android environment
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          java -version
          gradle --version

      - name: Validate source
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          if test -f run_core_tests.sh && test -f run_validation.sh; then
            chmod +x run_core_tests.sh run_validation.sh
            ./run_validation.sh
          else
            echo 'No project validation scripts present; continuing with Android build validation.'
          fi

      - name: Apply mandatory NEXUS V005/C002 baseline
        uses: ./.github/actions/nexus-v005-c002-branding
        with:
          project-root: ${{ env.PROJECT_ROOT }}
          icon-path: assets/nexus-icon.png

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify mandatory launcher identity in APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/ci/verify-nexus-v005-c002-apk.sh"
          "$GITHUB_WORKSPACE/ci/verify-nexus-v005-c002-apk.sh" \
            "$PROJECT_ROOT" \
            "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$PROJECT_ROOT/$ARTIFACT_NAME.apk"
          sha256sum "$PROJECT_ROOT/$ARTIFACT_NAME.apk" \
            > "$PROJECT_ROOT/$ARTIFACT_NAME.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PROJECT_ROOT }}/${{ env.ARTIFACT_NAME }}.apk
          if-no-files-found: error

      - name: Upload SHA256
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-SHA256
          path: ${{ env.PROJECT_ROOT }}/${{ env.ARTIFACT_NAME }}.apk.sha256
          if-no-files-found: error
