name: Normalize NEXUS icon

on:
  push:
    paths:
      - 'assets/nexus-icon.svg'
      - '.github/workflows/normalize-nexus-icon.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Render true PNG
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          rsvg-convert --width 1536 --height 1536 assets/nexus-icon.svg --output assets/nexus-icon.png
          file assets/nexus-icon.png | grep -q 'PNG image data'
          identify -format '%m %wx%h\n' assets/nexus-icon.png | grep -q '^PNG 1536x1536$'
          sha256sum assets/nexus-icon.png

      - name: Commit normalized PNG
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/nexus-icon.png; then
            echo 'PNG already normalized; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/nexus-icon.png
          git commit -m 'Normalize NEXUS icon as true PNG'
          git push
